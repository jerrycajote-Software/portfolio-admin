name: Auto Merge testing_stage to main

on:
  push:
    branches:
      - testing_stage

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge testing_stage into main
        run: |
          git checkout main
          git pull origin main
          git merge --ff-only testing_stage || git merge --no-ff testing_stage -m "chore: auto-merge testing_stage into main [skip ci]"
          git push origin main

